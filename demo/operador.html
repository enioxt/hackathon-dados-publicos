<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visão de Rota — operador</title>
<style>
:root{
  --bg:#f3f6fb; --card:#ffffff; --navy:#0b2545; --navy2:#12335e; --navy3:#173e73;
  --text:#1b2433; --muted:#5c6b82; --border:#e2e8f2; --border2:#ccd6e6;
  --green:#1f9d55; --green-bg:#e7f8ee; --amber:#e2a129; --amber-bg:#fdf3e0;
  --red:#d6444a; --red-bg:#fbe9ea; --blue:#2563eb; --blue-bg:#e8eefd;
  --focus:#2563eb;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
img{max-width:100%}
[hidden]{display:none!important}
a{color:inherit}
button{font-family:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.selo{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.04em;padding:1px 6px;border-radius:6px;margin-left:5px;vertical-align:middle;white-space:nowrap}
.selo.medido{background:var(--blue-bg);color:#1d4ed8}
.selo.simulacao{background:var(--amber-bg);color:#93670c}
.selo.sintetico{background:#eef0f5;color:#586479}

/* ---------- topo ---------- */
.topo{flex:none;display:flex;align-items:center;gap:14px;padding:8px 100px 8px 16px;background:var(--navy);color:#dbe7fb;font-size:12.5px}
.topo .titulo{font-weight:800;color:#fff;font-size:14px;white-space:nowrap}
.topo .dots{display:flex;gap:5px;align-items:center}
.topo .dot{width:9px;height:9px;border-radius:50%;background:#5f7699;border:1px solid rgba(255,255,255,.25);cursor:default}
.topo .dot.ativo{background:var(--green)}
.topo .dot.com-erro{background:var(--amber)}
.topo .spacer{flex:1}
.topo .relogio{font-variant-numeric:tabular-nums;color:#c7d7f0}
.topo .atualizado{color:#8ba1c4}
.topo a.link{color:#ffd27a;text-decoration:none;font-weight:700;white-space:nowrap}
.topo a.link:hover{text-decoration:underline}

/* ---------- corpo ---------- */
.corpo{flex:1;display:flex;gap:12px;padding:12px 16px;min-height:0}
.coluna-esq{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
.coluna-dir{width:380px;flex:none;display:flex;flex-direction:column;min-height:0}
@media (max-width:900px){.corpo{flex-direction:column}.coluna-dir{width:100%}}

/* ---------- botões enormes ---------- */
.grade-comandos{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:700px){.grade-comandos{grid-template-columns:1fr}}
.btn-comando{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);border:1.5px solid var(--border2);border-radius:14px;padding:14px 16px;min-height:112px;cursor:pointer;box-shadow:0 1px 2px rgba(15,37,68,.05)}
.btn-comando:hover{border-color:var(--navy2);box-shadow:0 3px 10px rgba(15,37,68,.1)}
.btn-comando:disabled{opacity:.55;cursor:default}
.btn-comando.selecionado{border-color:var(--navy2);background:#f5f8ff}
.btn-comando .ico{flex:none;width:46px;height:46px;border-radius:12px;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center}
.btn-comando .ico svg{width:24px;height:24px}
.btn-comando .txt b{display:block;font-size:15.5px;font-weight:800;color:#0f2544;margin-bottom:3px}
.btn-comando .txt span{display:block;font-size:12px;color:var(--muted);line-height:1.4}
.btn-comando.c5 .ico{background:#93670c}

/* ---------- painel esteira ---------- */
.painel-esteira{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.painel-esteira.vazio{align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:24px}
.painel-esteira .cabecalho{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;flex:none}
.painel-esteira h2{margin:0;font-size:14.5px;font-weight:800;color:#0f2544}
.painel-esteira .fechar{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:8px}
.painel-esteira .fechar:hover{background:#eef2f8}
.esteira-scroll{flex:1;min-height:0;overflow-y:auto;padding-right:2px}

.passo{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid var(--border);opacity:.35}
.passo:last-child{border-bottom:0}
.passo.ativo{opacity:1}
.passo.feito{opacity:1}
.passo .bolha{flex:none;width:22px;height:22px;border-radius:50%;background:#e2e8f2;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;margin-top:1px}
.passo.ativo .bolha{background:var(--amber);color:#5a3d05}
.passo.feito .bolha{background:var(--green);color:#fff}
.passo .passo-corpo{min-width:0;flex:1}
.passo .nome{font-weight:800;font-size:12.5px;color:#0f2544}
.passo .oque{font-size:12px;color:var(--text);margin-top:1px}
.passo .meta{font-size:11px;color:var(--muted);margin-top:2px;display:flex;flex-wrap:wrap;gap:6px}
.passo .meta code{background:#f1f4f9;border-radius:5px;padding:0 4px;font-size:10.5px}
.regra-aplicada{background:#f6f8fc;border:1px dashed var(--border2);border-radius:10px;padding:8px 10px;font-size:12px;margin-top:4px}
.regra-aplicada b{color:#0f2544}
.label-regra{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.03em;color:#5c6b82;text-transform:uppercase;margin-bottom:3px}
.resposta-assistente{background:#f6f8fc;border-radius:10px;padding:9px 10px;font-size:12.5px;white-space:pre-wrap;margin-top:4px;min-height:20px}
.pensando{color:var(--muted);font-style:italic}

.resultado{background:#eef4ff;border:1px solid #cfe0fb;border-radius:12px;padding:12px;margin-top:10px;font-size:13px;flex:none}
.resultado h3{margin:0 0 6px;font-size:13.5px;color:#0f2544}
.resultado .linha{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px dashed #d5e2f7;font-size:12.5px}
.resultado .linha:last-child{border-bottom:0}
.resultado .linha b{color:#0f2544}
.veredito{display:inline-block;font-size:11px;font-weight:800;border-radius:8px;padding:3px 9px;letter-spacing:.02em}
.veredito.melhorou{background:var(--green-bg);color:#1c7a44}
.veredito.piorou{background:var(--red-bg);color:#a8262d}
.veredito.sem-efeito{background:#eef0f5;color:#586479}

.naosei{background:#fdf3e0;border:1px solid #f2dba8;border-radius:10px;padding:9px 10px;font-size:12px;color:#6b4e0a;margin-top:10px;flex:none}
.naosei b{display:block;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:#93670c;margin-bottom:3px}

.acoes-humanas{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;flex:none}
.acoes-humanas button{border:0;border-radius:10px;padding:11px 14px;font-size:13px;font-weight:700;cursor:pointer;min-height:44px}
.acoes-humanas .aprovar{background:var(--navy2);color:#fff}
.acoes-humanas .aprovar:hover{background:var(--navy3)}
.acoes-humanas .descartar{background:#fff;color:#0f2544;border:1.5px solid var(--border2)}
.acoes-humanas .copiar{background:#fff;color:#0f2544;border:1.5px solid var(--border2)}
.aviso-simulacao{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic}
.toast-ok{font-size:12px;color:#1c7a44;font-weight:700;margin-top:6px}

/* ---------- decisões do turno ---------- */
.decisoes{margin-top:10px;flex:none;border-top:1px solid var(--border);padding-top:8px}
.decisoes summary{cursor:pointer;font-size:12px;font-weight:700;color:#0f2544;list-style:none}
.decisoes summary::-webkit-details-marker{display:none}
.decisoes summary::before{content:"▸ ";color:var(--muted)}
.decisoes[open] summary::before{content:"▾ "}
.decisao-item{font-size:11.5px;color:var(--muted);padding:5px 0;border-bottom:1px solid var(--border)}
.decisao-item:last-child{border-bottom:0}
.decisao-item b{color:#0f2544}

/* ---------- rodapé regras ---------- */
.rodape-regras{flex:none;display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px 8px 168px;background:#eef2f8;border-top:1px solid var(--border)}
@media (max-width:640px){.rodape-regras{padding:8px 16px;padding-bottom:64px}}
.pilula{background:#fff;border:1px solid var(--border2);border-radius:999px;padding:6px 12px;font-size:11.5px;font-weight:700;color:#0f2544;cursor:pointer}
.pilula:hover{border-color:var(--navy2)}
.pilula-detalhe{background:#fff;border:1px solid var(--border2);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--text);max-width:520px}

.rodape-espaco{flex:none;height:8px}
@media (max-width:640px){.rodape-espaco{height:56px}}
</style>
</head>
<body>

<header class="topo">
  <span class="titulo">Visão de Rota — operador</span>
  <div class="dots" id="dots" role="img" aria-label="estado dos 9 agentes"></div>
  <span class="spacer"></span>
  <span class="atualizado" id="atualizado">agentes: consultando…</span>
  <span class="relogio" id="relogio">--:--:--</span>
  <a class="link" href="/claro" data-local="/claro" data-estatico="painel-claro.html">painel completo →</a>
</header>

<div class="corpo">
  <div class="coluna-esq">
    <div class="grade-comandos" id="grade-comandos"></div>
  </div>
  <div class="coluna-dir">
    <div class="painel-esteira vazio" id="painel-esteira">
      Escolha um comando à esquerda. Os agentes envolvidos aparecem aqui, um a um, enquanto trabalham.
    </div>
  </div>
</div>

<footer class="rodape-regras" id="rodape-regras"></footer>
<div class="rodape-espaco" aria-hidden="true"></div>

<script>
(function(){
"use strict";

/* =================== semente fixa (determinístico) =================== */
function mulberry32(a){
  return function(){
    a |= 0; a = a + 0x6D2B79F5 | 0;
    var t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
var SEMENTE_BASE = 20260920;
function rngPara(offset){ return mulberry32(SEMENTE_BASE + offset); }

/* =================== base da API =================== */
var PORTA_API = 8787;
var MESMA_ORIGEM = (location.protocol !== "file:") && (String(location.port) === String(PORTA_API) || location.hostname === "127.0.0.1" && String(location.port) === String(PORTA_API));
var API_BASE = (location.protocol === "file:") ? null
  : (String(location.port) === String(PORTA_API) ? "" : "http://127.0.0.1:" + PORTA_API);
var CORS_BARRADO = false; // vira true na primeira falha de rede a uma chamada absoluta — some assistente sabe que a rota /operador ainda não está ligada

function urlApi(caminho){ return (API_BASE === null ? null : API_BASE + caminho); }

function buscarJSON(caminho, timeoutMs){
  var u = urlApi(caminho);
  if (u === null) return Promise.resolve(null);
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, timeoutMs || 6000) : null;
  return fetch(u, {cache:"no-store", signal: ctrl ? ctrl.signal : undefined}).then(function(r){
    if (t) clearTimeout(t);
    if (!r.ok) return null;
    return r.json();
  }).catch(function(){ if (t) clearTimeout(t); if (API_BASE) CORS_BARRADO = true; return null; });
}

/* =================== 12 pontos fixos (mesma leitura sintética do painel do gestor) =================== */
var PONTOS = [
  {id:1,  corredor:"A", status:"verde"},
  {id:2,  corredor:"A", status:"verde"},
  {id:3,  corredor:"A", status:"ambar"},
  {id:4,  corredor:"A", status:"verde"},
  {id:5,  corredor:"B", status:"ambar"},
  {id:6,  corredor:"B", status:"verde"},
  {id:7,  corredor:"B", status:"vermelho"},
  {id:8,  corredor:"B", status:"verde"},
  {id:9,  corredor:"C", status:"ambar"},
  {id:10, corredor:"C", status:"verde"},
  {id:11, corredor:"C", status:"vermelho"},
  {id:12, corredor:"C", status:"verde"}
];
var CACHE_PONTO = {};
function dadosPonto(id){
  if (CACHE_PONTO[id]) return CACHE_PONTO[id];
  var p = PONTOS.filter(function(x){return x.id===id;})[0];
  var rng = rngPara(id*97);
  var persistenciaMin = p.status==="vermelho" ? Math.round(11+rng()*17) : (p.status==="ambar" ? Math.round(4+rng()*8) : Math.round(1+rng()*3));
  var filaM = p.status==="vermelho" ? Math.round(90+rng()*70) : (p.status==="ambar" ? Math.round(45+rng()*30) : Math.round(5+rng()*15));
  var d = {id:id, nome:"Ponto "+id, corredor:p.corredor, status:p.status, persistenciaMin:persistenciaMin, filaM:filaM};
  CACHE_PONTO[id] = d;
  return d;
}
function pesoSeveridade(s){ return s==="vermelho" ? 3 : (s==="ambar" ? 1 : 0); }
function urgencia(d){ return pesoSeveridade(d.status) * d.persistenciaMin; }

/* =================== agentes / telemetria =================== */
var AGENTES = ["leitor-de-video","porta-de-entrada","verificador-de-privacidade","agregador","detector-de-evento","decisao-tipada","assistente","triagem-de-melhorias","gerador-de-fluxo"];
var resumoTelemetria = null; // último /api/telemetria/resumo, ou null se não deu para medir
var ultimaAtualizacaoTel = null;

function agenteResumo(nome){
  if (!resumoTelemetria || !resumoTelemetria.agentes) return null;
  for (var i=0;i<resumoTelemetria.agentes.length;i++) if (resumoTelemetria.agentes[i].agente===nome) return resumoTelemetria.agentes[i];
  return null;
}

function montarDots(){
  var wrap = document.getElementById("dots");
  wrap.innerHTML = "";
  AGENTES.forEach(function(nome){
    var r = agenteResumo(nome);
    var estado = r ? r.estado : "calado";
    var dot = document.createElement("span");
    dot.className = "dot " + (estado==="ativo"?"ativo":(estado==="com-erro"?"com-erro":""));
    var titulo = nome + " — " + (estado==="ativo"?"ativo":(estado==="com-erro"?"recusou/erro":"calado"));
    if (r && r.ultimo) titulo += " · " + r.ultimo.resumo;
    dot.title = titulo;
    wrap.appendChild(dot);
  });
}

function atualizarRelogio(){
  var d = new Date();
  document.getElementById("relogio").textContent = d.toLocaleTimeString("pt-BR", {hour:"2-digit",minute:"2-digit",second:"2-digit"});
  var rot = document.getElementById("atualizado");
  if (ultimaAtualizacaoTel === null) { rot.textContent = CORS_BARRADO ? "agentes: sem conexão com o servidor de dados (cópia isolada)" : "agentes: consultando…"; return; }
  var s = Math.max(0, Math.round((Date.now()-ultimaAtualizacaoTel)/1000));
  rot.textContent = "agentes: atualizado há " + s + " s";
}
setInterval(atualizarRelogio, 1000);
atualizarRelogio();

function atualizarTelemetria(){
  buscarJSON("/api/telemetria/resumo", 5000).then(function(j){
    if (j) { resumoTelemetria = j; ultimaAtualizacaoTel = Date.now(); }
    montarDots();
  });
}
atualizarTelemetria();
setInterval(atualizarTelemetria, 20000);

/* duração de um passo: usa mediana real da telemetria (última hora) se existir, senão estimado com semente fixa */
function duracaoPasso(agente, offsetSemente){
  var r = agenteResumo(agente);
  if (r && r.duracao_mediana_ms != null && r.eventos_1h > 0) {
    return { texto: r.duracao_mediana_ms + " ms", selo: "medido", detalhe: "mediana medida na última hora (" + r.eventos_1h + " evento(s))" };
  }
  var rng = rngPara(offsetSemente);
  var ms = Math.round(120 + rng()*760);
  return { texto: "≈ " + ms + " ms", selo: "estimado", detalhe: "estimado — sem telemetria real deste agente na última hora" };
}

/* =================== decisões do turno (localStorage) =================== */
var CHAVE_DECISOES = "vro_decisoes_turno_v1";
function lerDecisoes(){ try { var raw = localStorage.getItem(CHAVE_DECISOES); return raw ? JSON.parse(raw) : []; } catch(e){ return []; } }
function salvarDecisao(item){
  try {
    var l = lerDecisoes(); l.unshift(item);
    localStorage.setItem(CHAVE_DECISOES, JSON.stringify(l.slice(0,50)));
  } catch(e) { /* localStorage indisponível — decisão fica só na tela desta sessão */ }
}
function renderDecisoes(container){
  var lista = lerDecisoes();
  var det = document.createElement("details");
  det.className = "decisoes";
  var sum = document.createElement("summary");
  sum.textContent = "Decisões do turno (" + lista.length + ")";
  det.appendChild(sum);
  if (!lista.length) {
    var vazio = document.createElement("div");
    vazio.className = "decisao-item"; vazio.textContent = "nenhuma decisão registrada ainda nesta sessão.";
    det.appendChild(vazio);
  } else {
    lista.slice(0,12).forEach(function(it){
      var d = document.createElement("div"); d.className = "decisao-item";
      var hora = new Date(it.ts).toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      d.innerHTML = "<b>" + it.tipo + "</b> · " + hora + " · " + it.quem + " — " + it.resumo;
      det.appendChild(d);
    });
  }
  container.appendChild(det);
}

/* =================== assistente (1 chamada por comando) =================== */
function perguntarAssistente(msg, elResposta){
  elResposta.textContent = "pensando…";
  elResposta.classList.add("pensando");
  if (API_BASE === null) {
    elResposta.classList.remove("pensando");
    elResposta.textContent = "assistente desligado nesta cópia — resposta preparada: " + msg.split(".")[0] + ".";
    return Promise.resolve();
  }
  var u = urlApi("/chat");
  var ctrl = (typeof AbortController !== "undefined") ? new AbortController() : null;
  var t = ctrl ? setTimeout(function(){ ctrl.abort(); }, 35000) : null;
  return fetch(u, {method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({msg: msg}), signal: ctrl ? ctrl.signal : undefined})
    .then(function(r){
      if (!r.ok || !r.body) return r.text().then(function(txt){ throw new Error(txt || ("status "+r.status)); });
      var rd = r.body.getReader(), dec = new TextDecoder(), buf = "";
      function passo(){
        return rd.read().then(function(res){
          if (res.done) return;
          buf += dec.decode(res.value, {stream:true});
          var partes = buf.split("\n\n"); buf = partes.pop();
          partes.forEach(function(p){
            if (p.indexOf("data: ") !== 0) return;
            var ev; try { ev = JSON.parse(p.slice(6)); } catch(e){ return; }
            if (ev.tipo === "resposta") {
              elResposta.classList.remove("pensando");
              elResposta.textContent = (ev.erro ? "⚪ " : "") + (ev.texto || "(sem resposta)");
            }
          });
          return passo();
        });
      }
      return passo();
    })
    .catch(function(err){
      if (t) clearTimeout(t);
      CORS_BARRADO = true;
      elResposta.classList.remove("pensando");
      elResposta.textContent = "assistente desligado nesta cópia — resposta preparada: " + msg.split(".")[0] + ". (" + (err && err.message ? err.message.slice(0,80) : "sem conexão") + ")";
    })
    .then(function(){ if (t) clearTimeout(t); });
}

/* =================== helpers de UI da esteira =================== */
function el(tag, cls, html){ var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }

function abrirEsteira(titulo){
  var painel = document.getElementById("painel-esteira");
  painel.className = "painel-esteira";
  painel.innerHTML = "";
  var cab = el("div","cabecalho");
  cab.appendChild(el("h2", null, titulo));
  var fechar = el("button","fechar","✕");
  fechar.type = "button"; fechar.setAttribute("aria-label","fechar");
  fechar.onclick = function(){ painel.className = "painel-esteira vazio"; painel.innerHTML = "Escolha um comando à esquerda. Os agentes envolvidos aparecem aqui, um a um, enquanto trabalham."; };
  cab.appendChild(fechar);
  painel.appendChild(cab);
  var scroll = el("div","esteira-scroll");
  painel.appendChild(scroll);
  return scroll;
}

function novoPasso(scroll, agente, oque){
  var p = el("div","passo");
  var bolha = el("div","bolha","•");
  var corpo = el("div","passo-corpo");
  corpo.appendChild(el("div","nome",agente));
  corpo.appendChild(el("div","oque",oque));
  var meta = el("div","meta");
  corpo.appendChild(meta);
  var extra = el("div");
  corpo.appendChild(extra);
  p.appendChild(bolha); p.appendChild(corpo);
  scroll.appendChild(p);
  p.classList.add("ativo");
  scroll.scrollTop = scroll.scrollHeight;
  return {
    el: p, meta: meta, extra: extra,
    concluir: function(origemTxt, semente){
      var dur = duracaoPasso(agente, semente);
      meta.innerHTML = '<span>' + dur.texto + '</span><span class="selo ' + (dur.selo==="medido"?"medido":"sintetico") + '">' + (dur.selo==="medido"?"MEDIDO":"ESTIMADO") + '</span><code>' + origemTxt + '</code>';
      p.classList.remove("ativo"); p.classList.add("feito"); bolha.textContent = "✓";

  {rotulo:"Número decide por regra", texto:"O que vira número e veredito passa por uma função fixa e escrita — nunca por um modelo respondendo livremente."},
  {rotulo:"Dúvida vai para pessoa", texto:"Quando falta clareza ou a régua não decide, a pergunta sobe para quem está operando — o sistema não escolhe no escuro."},
  {rotulo:"Todo número diz de onde veio", texto:"Cada dado mostrado carrega a etiqueta de origem: medido, simulação ou dado sintético — nunca aparece sem explicação."},
  {rotulo:"Ação só com aprovação humana", texto:"Nenhum aviso, mensagem ou mudança sai sozinho — sempre passa por aprovar ou descartar antes de qualquer efeito."}
];
function montarRegras(){
  var wrap = document.getElementById("rodape-regras");
  wrap.innerHTML = "";
  REGRAS.forEach(function(r){
    var p = el("button","pilula", r.rotulo); p.type = "button";
    var det = null;
    p.onclick = function(){
      if (det) { det.remove(); det = null; return; }
      det = el("div","pilula-detalhe", r.texto);
      p.insertAdjacentElement("afterend", det);
    };
    wrap.appendChild(p);
  });
}

montarBotoes();
montarRegras();
montarDots();
